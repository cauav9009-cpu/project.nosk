<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Galeria — projeto.nosk</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    background:#060606;
    color:white;
    font-family:monospace;
}

header{
    padding:30px 7%;
    border-bottom:1px solid #222;
    display:flex;
    justify-content:space-between;
}

a{
    color:#777;
    text-decoration:none;
}

a:hover{color:#a66cff}

main{
    padding:90px 7%;
}

.number{
    color:#666;
    letter-spacing:3px;
}

h1{
    font-size:clamp(50px,9vw,110px);
    margin:25px 0;
}

.intro{
    color:#777;
    max-width:600px;
    line-height:1.8;
    margin-bottom:70px;
}

.gallery{
    columns:3 250px;
    column-gap:15px;
}

.item{
    break-inside:avoid;
    margin-bottom:15px;
    border:1px solid #222;
    overflow:hidden;
}

.item img{
    display:block;
    width:100%;
    transition:.5s;
}

.item:hover img{
    transform:scale(1.04);
}

.placeholder{
    min-height:250px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#444;
    text-align:center;
}

footer{
    margin-top:100px;
    padding:30px 7%;
    border-top:1px solid #222;
    color:#555;
}
</style>
</head>

<body>

<header>

<strong>
projeto<span style="color:#666">.nosk</span>
</strong>

<a href="../Nosk.html">← voltar</a>

</header>

<main>

<div class="number">04 / GALERIA</div>

<h1>FRAGMENTOS.</h1>

<p class="intro">
    Imagens, personagens, conceitos,
    experimentos e coisas que foram
    encontradas pelo caminho.
</p>

<section class="gallery">

    <div class="item">
        <img src="../assets/images/personagem1.png"
             alt="Personagem">
    </div>

    <div class="item">
        <img src="../assets/images/personagem2.png"
             alt="Personagem">
    </div>

    <div class="item">
        <div class="placeholder">
            IMAGEM // 003
        </div>
    </div>

    <div class="item">
        <div class="placeholder">
            IMAGEM // 004
        </div>
    </div>

    <div class="item">
        <div class="placeholder">
            IMAGEM // 005
        </div>
    </div>

</section>

</main>

<footer>
projeto.nosk // gallery
</footer>

</body>
</html>
